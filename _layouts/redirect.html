<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tep.li → {{ page.redirect.to | default: page.redirect_to }}</title>
<meta http-equiv="refresh" content="2; url={{ page.redirect.to | default: page.redirect_to }}">
<meta name="theme-color" content="#080e1b">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080e1b;color:#e2e8f0;font-family:system-ui,sans-serif}
.card{background:#121d32;border:1px solid rgba(255,255,255,.08);padding:2.2rem 2.5rem;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center;max-width:460px;width:calc(100% - 32px)}
h1{margin:0;font-size:2rem;background:linear-gradient(90deg,#7cc7ff,#2dd4bf);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#94a3b8}
a{color:#7cc7ff;text-decoration:none}
.bar{height:4px;background:#1e293b;margin-top:1.5rem;overflow:hidden;border-radius:2px}
.bar>div{height:100%;width:100%;background:linear-gradient(90deg,#7cc7ff,#2dd4bf);animation:load 2s linear forwards}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(0)}}
code{background:rgba(255,255,255,.06);padding:2px 6px;border-radius:6px;font-size:.9em}
</style>
</head>
<body>
<div class="card">
<h1>tep.li</h1>
<p style="margin-top:.5rem;color:#e2e8f0;font-weight:600">Shortlinks for Tep Worlds</p>
<p>Redirecting you to</p>
<p style="color:#e2e8f0;word-break:break-all"><strong>{{ page.redirect.to | default: page.redirect_to }}</strong></p>
<p style="font-size:.85rem">from <code>{{ page.redirect.from | default: page.slug | default: page.url }}</code></p>
<div class="bar"><div></div></div>
<p style="margin-top:1.2rem"><a href="{{ page.redirect.to | default: page.redirect_to }}">Click here if not redirected</a></p>
</div>
</body>
</html>
